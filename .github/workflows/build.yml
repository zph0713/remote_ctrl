name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build app
        run: swift build -c release --product MiVoice
      - name: Test core
        run: swift test
      - name: Audit network APIs
        run: ./scripts/audit.sh
