name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15-intel
    env:
      ARCHS: "arm64 x86_64"
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Build app
        run: INSTALL=0 ./scripts/build-app.sh

      - name: Zip app
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            dist/MiVoice.app "dist/MiVoice-${GITHUB_REF_NAME}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/MiVoice-${GITHUB_REF_NAME}.zip" \
            --title "MiVoice ${GITHUB_REF_NAME}" \
            --notes-file Packaging/RELEASE_NOTES.md
